<div class="register-wrapper">
  <header class="register-header">
    <a routerLink="/login" class="brand-link"><app-logo /></a>

    <div class="header-tag">
      <nav class="header-nav-actions">
        <a routerLink="/login" routerLinkActive="active" class="nav-btn">Login</a>
        <a routerLink="/registro" routerLinkActive="active" class="nav-btn">Registrarse</a>
      </nav>
    </div>
  </header>

  <main class="register-main">
    <div class="register-intro">
      <span class="intro-tag">NUEVO JUGADOR</span>
      <h1 class="intro-title">Creá tu personaje.</h1>
      <p class="intro-subtitle">Sumate a la comunidad para compartir partidas, guías, reseñas y encontrar squad.</p>
    </div>

    <div class="register-card">
      <div class="card-header-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="badge-icon">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        <h2 class="card-title">Crear una cuenta</h2>
      </div>

      @if (errorMensaje()) {
        <div class="alert-box-error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="alert-icon">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span class="alert-text">{{ errorMensaje() }}</span>
        </div>
      }

      <app-formulario-usuario
        textoBoton="Crear cuenta"
        textoCargando="Creando tu cuenta..."
        [cargando]="loading()"
        [mostrarPerfil]="false"
        (enviar)="registrar($event)"
      />

      <footer class="register-footer">
        <span class="footer-prompt">¿Ya tenés cuenta?</span>
        <a routerLink="/login" class="footer-link">Iniciá sesión</a>
      </footer>
    </div>
  </main>
</div>
