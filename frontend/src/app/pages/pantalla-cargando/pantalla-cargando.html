<div class="loading-screen">
  <div class="grid-bg" aria-hidden="true"></div>

  <div class="loading-card" role="status" aria-live="polite">
    <div class="ring-wrap">
      <div class="ring ring-outer"></div>
      <div class="ring ring-inner"></div>
      <app-logo [conTexto]="false" tamano="64px" />
    </div>

    <app-logo />
    <h1 class="loading-title">
      @if (sinConexion()) { CONEXIÓN PERDIDA } @else { CARGANDO PARTIDA<span class="dots"></span> }
    </h1>
    <p class="loading-message">{{ mensaje() }}</p>

    @if (sinConexion()) {
      <button type="button" class="btn btn-primary" (click)="verificarSesion()">Reintentar</button>
    } @else {
      <div class="progress" aria-hidden="true"><div class="progress-bar"></div></div>
      <p class="loading-tip">{{ tip() }}</p>
    }

    <div class="loading-badge">
      <span class="badge-prefix">AUTH</span>
      <span class="badge-separator">/</span>
      <span class="badge-action">POST /auth/autorizar</span>
    </div>
  </div>
</div>
