<header class="navbar-wrapper">
  <div class="navbar-container">
    <a routerLink="/publicaciones" class="brand-link" aria-label="Ir a publicaciones">
      <app-logo />
    </a>

    <!-- Navegación desktop -->
    <nav class="nav-desktop">
      <a routerLink="/publicaciones" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        <span>Publicaciones</span>
      </a>

      <!-- Directiva estructural propia: solo administradores -->
      <a *appSoloAdmin routerLink="/dashboard/usuarios" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Usuarios</span>
      </a>
      <a *appSoloAdmin routerLink="/dashboard/estadisticas" routerLinkActive="active" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="nav-icon">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Estadísticas</span>
      </a>

      <a routerLink="/mi-perfil" routerLinkActive="active" class="nav-item">
        <img [src]="usuario()?.imagen" appImagenFallback alt="" class="avatar-sm" />
        <span>Mi perfil</span>
        @if (authService.esAdmin()) {
          <span class="chip chip-lime admin-chip">ADMIN</span>
        }
      </a>

      <button type="button" class="btn-logout-nav" (click)="cerrarSesion()" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="logout-icon">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Salir</span>
      </button>
    </nav>

    <!-- Botón del menú mobile -->
    <button type="button" class="btn-burger" (click)="toggleMenu()" aria-label="Abrir menú de navegación">
      <span class="burger-bar"></span>
      <span class="burger-bar"></span>
      <span class="burger-bar"></span>
    </button>
  </div>
</header>

<!-- Drawer lateral (mobile) -->
@if (menuAbierto()) {
  <div class="drawer-backdrop" (click)="cerrarMenu()">
    <aside class="drawer-panel" (click)="$event.stopPropagation()">
      <div class="drawer-top">
        <app-logo />
        <button type="button" class="btn-close-drawer" (click)="cerrarMenu()" aria-label="Cerrar menú">✕</button>
      </div>

      <div class="drawer-profile">
        <img [src]="usuario()?.imagen" appImagenFallback alt="" class="avatar-drawer" />
        <div class="profile-meta">
          <h3 class="profile-name">{{ usuario()?.nombre }} {{ usuario()?.apellido }}</h3>
          <span class="profile-handle">&#64;{{ usuario()?.nombreUsuario }}</span>
        </div>
      </div>

      <nav class="drawer-links">
        <a routerLink="/publicaciones" (click)="cerrarMenu()" routerLinkActive="active" class="drawer-link-item">
          <div class="link-left"><span>Publicaciones</span></div>
          <span class="arrow-indicator">›</span>
        </a>
        <a routerLink="/mi-perfil" (click)="cerrarMenu()" routerLinkActive="active" class="drawer-link-item">
          <div class="link-left"><span>Mi perfil</span></div>
          <span class="arrow-indicator">›</span>
        </a>
        <a *appSoloAdmin routerLink="/dashboard/usuarios" (click)="cerrarMenu()" routerLinkActive="active" class="drawer-link-item">
          <div class="link-left"><span>Dashboard · Usuarios</span></div>
          <span class="arrow-indicator">›</span>
        </a>
        <a *appSoloAdmin routerLink="/dashboard/estadisticas" (click)="cerrarMenu()" routerLinkActive="active" class="drawer-link-item">
          <div class="link-left"><span>Dashboard · Estadísticas</span></div>
          <span class="arrow-indicator">›</span>
        </a>
      </nav>

      <div class="drawer-bottom">
        <button type="button" class="btn-drawer-logout" (click)="cerrarSesion()">
          <span>Cerrar sesión</span>
        </button>
        <span class="drawer-sublegal-label">Checkpoint · Comunidad gamer</span>
      </div>
    </aside>
  </div>
}
